name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test shared core
        run: dotnet test --project .\tests\AIHappey.Cli.Tests\AIHappey.Cli.Tests.csproj -c Release
      - name: Build header profile
        shell: pwsh
        run: |
          $profile = (Resolve-Path .\profiles\header-auth\sample.props).Path
          dotnet build .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$profile"
      - name: Publish aihappey
        shell: pwsh
        run: |
          $header = (Resolve-Path .\profiles\header-auth\sample.props).Path
          dotnet publish .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$header" -o .\artifacts\aihappey
      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive `
          -Path .\artifacts\aihappey\* `
          -DestinationPath .\artifacts\aihappey.zip `
          -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aihappey
          path: .\artifacts\aihappey.zip

      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin latest --force

          if (gh release view latest 2>$null) {
            gh release upload latest .\artifacts\aihappey.zip --clobber
          } else {
            gh release create latest .\artifacts\aihappey.zip `
              --title "Latest build" `
              --notes "Latest build from main."
          }