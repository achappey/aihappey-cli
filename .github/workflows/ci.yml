name: ci

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test shared core
        run: dotnet test .\tests\AIHappey.Cli.Tests\AIHappey.Cli.Tests.csproj -c Release
      - name: Build header profile
        shell: pwsh
        run: |
          $profile = (Resolve-Path .\profiles\header-auth\sample.props).Path
          dotnet build .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$profile"
      - name: Build Azure profile
        shell: pwsh
        run: |
          $profile = (Resolve-Path .\profiles\azure-entra\sample.props).Path
          dotnet build .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$profile"
      - name: Pack both sample profiles
        shell: pwsh
        run: |
          $header = (Resolve-Path .\profiles\header-auth\sample.props).Path
          $azure = (Resolve-Path .\profiles\azure-entra\sample.props).Path
          dotnet pack .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$header" -p:PackageOutputPath="$PWD\artifacts\packages\header"
          dotnet pack .\src\AIHappey.Cli\AIHappey.Cli.csproj -c Release -p:CliProfile="$azure" -p:PackageOutputPath="$PWD\artifacts\packages\azure"
